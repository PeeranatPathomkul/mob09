# Tuned for the load test: 1,000 concurrent readers and 500 concurrent
# writers. The stock nginx defaults cannot carry that — see the notes below,
# because each number here is load-bearing.

# Default is 1. One process cannot saturate a multi-core host under this load.
worker_processes auto;

# Each worker needs two file descriptors per proxied request (one to the
# client, one to the upstream), plus headroom.
worker_rlimit_nofile 16384;

events {
  # Default is 512, and it is a PER-WORKER cap counting BOTH sides of a
  # proxied request — so the stock config tops out near 256 concurrent
  # requests. The write test alone opens 540 at once, which is why requests
  # were failing at the connection level (k6 reports those as status 0, not
  # as an HTTP error).
  worker_connections 4096;
}

http {
  # Buffer access logs instead of doing a blocking write per request.
  access_log /var/log/nginx/access.log combined buffer=32k flush=5s;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;

  upstream backend {
    least_conn;

    # max_fails defaults to 1 with fail_timeout 10s: a single hiccup ejects a
    # backend for ten seconds. Under a burst all three get ejected at once and
    # nginx answers "no live upstreams" with 502 for everything — which is
    # exactly what the logs showed. Require repeated failures, and forgive
    # them quickly.
    server api1:3000 max_fails=5 fail_timeout=5s;
    server api2:3000 max_fails=5 fail_timeout=5s;
    server api3:3000 max_fails=5 fail_timeout=5s;

    # Reuse upstream connections instead of a fresh TCP handshake (and a
    # TIME_WAIT socket) per request.
    keepalive 128;
    keepalive_requests 1000;
  }

  # POST /api/v1/orders only. Split out because reads and writes were sharing
  # the same three Node processes: at ~200 reads per write, the enqueue path
  # spent its time behind read callbacks in the event loop rather than doing
  # any work of its own (p95 208ms alone, 8,549ms alongside the read load).
  #
  # Two servers, least_conn like the read pool: this path never queries
  # Postgres, so what it needs is more event loops to spread the burst over.
  upstream write_backend {
    least_conn;

    server api-write:3000 max_fails=5 fail_timeout=5s;
    server api-write2:3000 max_fails=5 fail_timeout=5s;

    keepalive 64;
    keepalive_requests 1000;
  }

  server {
    listen 80 backlog=4096;

    # Declared once at server level so both locations below inherit them.
    # nginx does not merge a location-level proxy_set_header with an outer
    # one -- a single such directive inside a location would drop every
    # header set here -- so these stay together and neither location adds
    # headers of its own.
    #
    # Both lines are required for upstream keepalive to actually engage:
    # HTTP/1.1, and an empty Connection header so the default
    # "Connection: close" is not forwarded.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Exact match, and it beats the prefix location below regardless of the
    # order they appear in. Only POST is defined on this path, so there is
    # no need to branch on $request_method.
    location = /api/v1/orders {
      proxy_pass http://write_backend;
    }

    # Everything else -- GET /api/v1/products carries essentially all of it.
    location / {
      proxy_pass http://backend;
    }
  }
}
