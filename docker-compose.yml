services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api1: &api
    build:
      context: ./api
    command: ["node", "dist/main"]
    env_file: .env
    expose:
      - "3000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  api2:
    <<: *api

  api3:
    <<: *api

  worker:
    build:
      context: ./api
    command: ["node", "dist/worker.main"]
    env_file: .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  bull-board:
    build:
      context: ./bull-board
    env_file: .env
    environment:
      - PORT=3001
    ports:
      - "4001:3001"
    depends_on:
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3
    restart: unless-stopped

volumes:
  postgres_data:
