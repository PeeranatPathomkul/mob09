services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Exposed so load-test/measure.js can read the queue from the host.
    # 6380, not 6379: another project on this machine already holds 6379, and
    # a host tool pointed at the wrong Redis silently reports an empty queue.
    ports:
      - "6380:6379"
    restart: unless-stopped

  api1: &api
    build:
      context: ./api
    command: ["node", "dist/main"]
    env_file: .env
    # Listed explicitly (see the worker service below for why) so a
    # cache-tuning sweep can override them without editing .env or rebuilding.
    environment:
      - CACHE_VERSION_KEY=${CACHE_VERSION_KEY:-products:cache:version}
      - PRODUCT_CACHE_TTL_MIN_SECONDS=${PRODUCT_CACHE_TTL_MIN_SECONDS:-30}
      - PRODUCT_CACHE_TTL_MAX_SECONDS=${PRODUCT_CACHE_TTL_MAX_SECONDS:-60}
      - PRODUCT_CACHE_LOCK_TTL_SECONDS=${PRODUCT_CACHE_LOCK_TTL_SECONDS:-5}
      - PRODUCT_CACHE_LOCK_RETRY_MAX=${PRODUCT_CACHE_LOCK_RETRY_MAX:-5}
      - PRODUCT_CACHE_LOCK_RETRY_DELAY_MS=${PRODUCT_CACHE_LOCK_RETRY_DELAY_MS:-50}
    expose:
      - "3000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  api2:
    <<: *api

  api3:
    <<: *api

  worker:
    build:
      context: ./api
    command: ["node", "dist/worker.main"]
    env_file: .env
    # Listed explicitly (and not only in .env) so a benchmark sweep can
    # override them per run — `environment` wins over `env_file`, so
    # `WORKER_CONCURRENCY=32 docker compose up -d worker` takes effect
    # without editing .env or rebuilding the image.
    environment:
      - STOCK_CLAIM_STRATEGY=${STOCK_CLAIM_STRATEGY:-pessimistic}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-10}
      - DB_POOL_MAX=${DB_POOL_MAX:-12}
      - DB_LOCK_TIMEOUT=${DB_LOCK_TIMEOUT:-5s}
      - CACHE_VERSION_KEY=${CACHE_VERSION_KEY:-products:cache:version}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  bull-board:
    build:
      context: ./bull-board
    env_file: .env
    environment:
      - PORT=3001
    ports:
      - "4001:3001"
    depends_on:
      - redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3
    restart: unless-stopped

  # Load generator. Behind the "loadtest" profile so `docker compose up` never
  # starts it — it only runs when asked for explicitly:
  #
  #   # our own stack (default script: orders-500.js)
  #   docker compose --profile loadtest run --rm k6
  #
  #   # a different script
  #   docker compose --profile loadtest run --rm k6 /scripts/products-read.js
  #
  #   # another group's system — note the :8080, since that host publishes
  #   # nginx on a port rather than sharing this network
  #   docker compose --profile loadtest run --rm -e BASE_URL=http://172.30.58.13:8080 k6
  #
  # Staying inside the compose network matters for our own stack: from the
  # Windows host, opening 500 connections at once gets refused by Docker
  # Desktop's port forwarder and ~20% of requests never leave the machine.
  # From in here they all land, which is why BASE_URL defaults to the
  # service name and not localhost:8080.
  k6:
    image: grafana/k6:latest
    profiles: ["loadtest"]
    volumes:
      - ./load-test:/scripts
    environment:
      - BASE_URL=${BASE_URL:-http://nginx}
      - RAMP=${RAMP:-0s}
      - OUT=${OUT:-/scripts/results/k6-summary.json}
    entrypoint: ["k6", "run"]
    command: ["/scripts/orders-500.js"]

volumes:
  postgres_data:
